[alembic]
# Path to migration scripts — relative to this file (backend/).
script_location = alembic

# Prepend backend/ to sys.path so `from app...` imports work inside env.py.
prepend_sys_path = .

# Overridden at runtime from app.config.settings.database_url — never commit real credentials here.
sqlalchemy.url = postgresql+asyncpg://user:password@localhost/travel_planning

# Prefix used to name migration files: YYYY-MM-DD_<rev>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
